name: Build Notedpad APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK as GitHub Release'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Determine release version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APP_VER="${GITHUB_REF#refs/tags/v}"
          else
            APP_VER="1.3.${{ github.run_number }}"
          fi
          echo "APP_VER=${APP_VER}" >> $GITHUB_ENV
          echo "Release version: ${APP_VER} (versionCode=${{ github.run_number }})"

      - name: Install web dependencies & build dist
        env:
          VITE_APP_VERSION: ${{ env.APP_VER }}
        run: |
          npm install --legacy-peer-deps
          npm run lint
          npm run build

      - name: Sync web bundle into Android assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (API 35)
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$SDK_MANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure release signing keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          elif [ ! -f android/app/release.jks ]; then
            keytool -genkeypair -v \
              -keystore android/app/release.jks \
              -alias "${{ secrets.ANDROID_KEY_ALIAS || 'notedpad' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.ANDROID_STORE_PASSWORD || 'notedpad123' }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'notedpad123' }}" \
              -dname "CN=Notedpad, OU=AG, O=Abujar, L=Dhaka, S=Dhaka, C=BD"
          fi
          keytool -list -keystore android/app/release.jks -storepass "${{ secrets.ANDROID_STORE_PASSWORD || 'notedpad123' }}"

      - name: Build minified Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || 'notedpad123' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'notedpad' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'notedpad123' }}
        run: |
          gradle assembleRelease --no-daemon -PVERSION_NAME="${APP_VER}" -PVERSION_CODE="${{ github.run_number }}"

      - name: Package APK output
        run: |
          mkdir -p release-output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK file missing after Gradle build!"
            exit 1
          fi
          cp "$APK_PATH" "release-output/Notedpad-v${APP_VER}.apk"
          ls -lh release-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notedpad-APK
          path: release-output/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VER) }}
          name: Notedpad v${{ env.APP_VER }}
          files: release-output/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

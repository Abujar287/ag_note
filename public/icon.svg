  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="82" fill="#bfdbfe" text-anchor="middle" letter-spacing="8">NOTE</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mask-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="circle-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background to ensure safe zone margin on Android -->
  <rect width="512" height="512" fill="url(#mask-bg)"/>
  <!-- Central circle inside the 80% safe zone -->
  <circle cx="256" cy="256" r="190" fill="url(#circle-bg)"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="#93c5fd" stroke-width="3" stroke-opacity="0.6"/>
  <text x="256" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="130" fill="#ffffff" text-anchor="middle" letter-spacing="-1">AG</text>
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="64" fill="#bfdbfe" text-anchor="middle" letter-spacing="6">NOTE</text>
</svg>
